environment: BasicImageEnv

telescope_config = configs/telescope/basicOnePanelTelescopeConfig.yaml

max_steps: 512

observation_space:
  type: Box
  low: 0
  high: 255
  dype: uint8

action_space:
  type: Box
  low: -1
  high: 1
  shape: [2]
  dtype: float32

training:
  policy: CnnPolicy
  learning_rate: 0.0001
  n_steps: 512
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.1
  clip_range_vf: None
  normalize_advantage: True
  ent_coef: 0.001
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sde: False
  sde_sample_freq: -1
  rollout_buffer_class: None
  rollout_buffer_kwargs: None
  target_kl: None
  stats_window_size: 100
  tensorboard_log: runs/phaseOne/06-01-2026_onePanelImageCodeCheck/

  verbose: 1
  seed: None
  device: cpu
  _init_setup_model: True

vec_env_cls: SubprocVecEnv

total_timesteps: 100000
n_training_envs: 8
model_save_path: runs/phaseOne/06-01-2026_onePanelImageCodeCheck/agent