environment: AllDictObsEnvDiffImgDiffRewOneHotID
model_save_path: runs/fine_alignment/d07_07_26_tube_dragging/0.01/agents
total_timesteps: 6000000
save_frequency: 500000

env_params:
  max_steps: 512
  telescope: configs/telescopes/fine_alignment/tube_dragging/tube_dragging_0.01.yaml

n_training_envs: 8
vec_env_cls: SubprocVecEnv

network:
  feature_extractor_class: EverythingDictWithOneHotPanelIDs
  feature_extractor_config: configs/architectures/everythingDict.yaml
  pi: [512, 256, 256]
  vf: [512, 512, 256, 128, 64]

train_config:
  policy: MultiInputPolicy
  learning_rate: 0.0001
  n_steps: 1024
  batch_size: 128
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.1
  normalize_advantage: True
  ent_coef: 0.0001
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sde: False
  sde_sample_freq: -1
  stats_window_size: 100
  tensorboard_log: runs/fine_alignment/d07_07_26_tube_dragging/0.01/

  verbose: 1
  device: auto
  _init_setup_model: True
