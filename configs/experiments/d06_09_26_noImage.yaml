environment: NoImagePSCTP12Env
model_save_path: runs/06-09-2026-multPanelNoImage/agent6
total_timesteps: 5000000
save_frequency: 1000000

env_params:
  max_steps: 512
  telescope: configs/telescopes/basicMultiPanelP12Config.yaml

n_training_envs: 8
vec_env_cls: SubprocVecEnv

network:
  pi: [256, 256, 256]
  vf: [256, 256, 256]

train_config:
  policy: MlpPolicy
  learning_rate: 0.0001
  n_steps: 512
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.1
  normalize_advantage: True
  ent_coef: 0.0001
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sde: False
  sde_sample_freq: -1
  stats_window_size: 100
  tensorboard_log: runs/06-09-2026-multPanelNoImage/

  verbose: 1
  device: auto
  _init_setup_model: True
