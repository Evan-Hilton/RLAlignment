environment: NoImageOneCentroidObs
model_save_path: runs/06-09-2026-multPanelNoImageOneCentroidObs/agent8.1
total_timesteps: 1000000
save_frequency: 500000

env_params:
  max_steps: 1024
  telescope: configs/telescopes/basicMultiPanelP12Config.yaml

n_training_envs: 8
vec_env_cls: SubprocVecEnv

network:
  pi: [256, 256, 128]
  vf: [256, 256, 128]

train_config:
  policy: MlpPolicy
  learning_rate: 0.0001
  n_steps: 512
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.1
  normalize_advantage: True
  ent_coef: 0.0001
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sde: False
  sde_sample_freq: -1
  stats_window_size: 100
  tensorboard_log: runs/06-09-2026-multPanelNoImageOneCentroidObs/

  verbose: 1
  device: cpu
  _init_setup_model: True