environment: NaiveImageEnv
model_save_path: runs/fine_alignment/06-12-2026-naiveInitialFineAlignmentExp/agent1
total_timesteps: 1000000
save_frequency: 500000

env_params:
  max_steps: 512
  telescope: configs/telescopes/fine_alignment/basicTelescopeConfig.yaml

n_training_envs: 8
vec_env_cls: SubprocVecEnv

network:
  feature_extractor_class: ConfigurableCNN
  feature_extractor_config: configs/architectures/basicCnn.yaml
  pi: [256, 256]
  vf: [256, 256]

train_config:
  policy: CnnPolicy
  learning_rate: 0.0001
  n_steps: 512
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.1
  normalize_advantage: True
  ent_coef: 0.0001
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sde: False
  sde_sample_freq: -1
  stats_window_size: 100
  tensorboard_log: runs/fine_alignment/06-12-2026-naiveInitialFineAlignmentExp/

  verbose: 1
  device: cpu
  _init_setup_model: True
