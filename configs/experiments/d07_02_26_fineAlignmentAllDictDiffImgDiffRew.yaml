environment: AllDictObsEnvDiffImgDiffRew
model_save_path: runs/fine_alignment/07-02-2026-everythingDictDiffImgDiffRew/agent3
total_timesteps: 310000
save_frequency: 310000

env_params:
  max_steps: 512
  telescope: configs/telescopes/fine_alignment/basicTelescopeConfig.yaml

n_training_envs: 8
vec_env_cls: SubprocVecEnv

network:
  feature_extractor_class: EverythingDict
  feature_extractor_config: configs/architectures/everythingDict.yaml
  pi: [256, 256]
  vf: [256, 256, 256, 128]

train_config:
  policy: MultiInputPolicy
  learning_rate: 0.0001
  n_steps: 1024
  batch_size: 128
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.1
  normalize_advantage: True
  ent_coef: 0.0001
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sde: False
  sde_sample_freq: -1
  stats_window_size: 100
  tensorboard_log: runs/fine_alignment/07-02-2026-everythingDictDiffImgDiffRew/

  verbose: 1
  device: auto
  _init_setup_model: True
